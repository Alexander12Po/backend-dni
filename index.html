<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Consulta DNI</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="logo">
    <span>Icono</span>
    <div>
      Consulta DNI
      <span class="sub">Rapido . Seguro . En linea</span>
    </div>
  </div>
</header>

<section class="hero">
  <p class="tag">PLATAFORMA DE CONSULTAS</p>
  <h1>CONSULTA DE <span>DNI</span></h1>
  <p class="desc">Obten informacion rapida sobre un numero de DNI.</p>
</section>

<div class="card-consulta">
  <label for="dni">Numero de DNI</label>
  <input type="text" id="dni" placeholder="Ej. 12345678" maxlength="8">
  <button id="btnConsultar">Consultar</button>
</div>

<div id="resultado"></div>

<footer>Consulta DNI</footer>

<script src="script.js"></script>
</body>
</html>
